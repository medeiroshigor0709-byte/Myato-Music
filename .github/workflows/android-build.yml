name: Android CI & APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package MYATO MUSIC APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true
          packages: ""

      - name: Configure SDK Environment & Query Remote Catalog
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT points to an existing directory."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

          CATALOG_FILE="/tmp/android-sdk-catalog.txt"
          rm -f "$CATALOG_FILE"
          sdkmanager --list > "$CATALOG_FILE"

          python3 - "$CATALOG_FILE" << 'PYEOF'
          import sys

          catalog_path = sys.argv[1]
          with open(catalog_path, "r", encoding="utf-8", errors="replace") as f:
              raw = f.read()

          required = ("platform-tools", "platforms;android-36", "build-tools;36.0.0")
          found = {}
          for line in raw.replace("\r", "\n").splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("[") or stripped.startswith("---"):
                  continue
              pkg_id = stripped.split("|", 1)[0].strip()
              if pkg_id in required:
                  found.setdefault(pkg_id, []).append(stripped)

          print("=== Required packages in sdkmanager --list ===")
          for pkg in required:
              entries = found.get(pkg, [])
              if entries:
                  for entry in entries:
                      print(f"FOUND: {entry}")
              else:
                  print(f"MISSING: {pkg}")

          missing = [pkg for pkg in required if pkg not in found]
          if missing:
              sys.stderr.write(f"::error::Required packages missing from sdkmanager --list catalog: {', '.join(missing)}\n")
              sys.exit(1)
          PYEOF
          rm -f "$CATALOG_FILE"

      - name: Accept Android SDK Licenses
        run: |
          set -euo pipefail
          YES_FILE="/tmp/sdk-yes.txt"
          python3 -c 'print("y\n" * 50, end="")' > "$YES_FILE"
          sdkmanager --licenses < "$YES_FILE"
          rm -f "$YES_FILE"

      - name: Install Android SDK platform-tools
        run: sdkmanager --install "platform-tools"

      - name: Install Android SDK platforms;android-36
        run: sdkmanager --install "platforms;android-36"

      - name: Install Android SDK build-tools;36.0.0
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Verify Installed SDK Components & Directories
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

          if [ -z "${ANDROID_HOME:-}" ] || [ -z "${ANDROID_SDK_ROOT:-}" ] || [ "$ANDROID_HOME" != "$ANDROID_SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT must both point to the same SDK directory."
            exit 1
          fi

          for required_dir in \
            "$ANDROID_HOME/platform-tools" \
            "$ANDROID_HOME/platforms/android-36" \
            "$ANDROID_HOME/build-tools/36.0.0"; do
            if [ ! -d "$required_dir" ]; then
              echo "::error::Required SDK directory missing: $required_dir"
              exit 1
            fi
            echo "Verified directory: $required_dir"
          done

          for required_file in \
            "$ANDROID_HOME/platform-tools/adb" \
            "$ANDROID_HOME/platforms/android-36/android.jar" \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner"; do
            if [ ! -e "$required_file" ]; then
              echo "::error::Required SDK file missing: $required_file"
              exit 1
            fi
            echo "Verified file: $required_file"
          done

          sdkmanager --list_installed

      - name: Validate Toolchain (Java, Gradle Wrapper, ADB)
        run: |
          set -euo pipefail
          java -version
          chmod +x gradlew
          ./gradlew --version
          adb version

      - name: Ensure debug.keystore is available
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              python3 -c '
          import base64
          with open("debug.keystore.base64", "r", encoding="utf-8") as src:
              raw = "".join(src.read().split())
          with open("debug.keystore", "wb") as dst:
              dst.write(base64.b64decode(raw))
          '
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated fallback debug.keystore"
            fi
          fi
          ls -lh debug.keystore

      - name: Clean Gradle Build
        run: ./gradlew clean --no-daemon

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          mkdir -p dist
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            exit 1
          fi
          cp "$DEBUG_APK" dist/MYATO-MUSIC-debug.apk
          cp "$DEBUG_APK" dist/MYATO-MUSIC.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/MYATO-MUSIC-debug.apk
          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MYATO-MUSIC-debug-apk
          path: |
            dist/MYATO-MUSIC-debug.apk
            dist/MYATO-MUSIC.apk
          retention-days: 30

      - name: Build & Sign Release APK (when keystore secrets are configured)
        id: release_build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ORIG_KS="/tmp/myato-release-orig.jks"
          GRADLE_KS="/tmp/myato-release-gradle.jks"
          cleanup() {
            rm -f "$ORIG_KS" "$GRADLE_KS"
          }
          trap cleanup EXIT

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::notice::Release signing secrets not configured. Skipping signed Release APK. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to generate MYATO-MUSIC-release.apk."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "$ORIG_KS" << 'PYEOF'
          import base64, os, sys
          raw = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          with open(sys.argv[1], "wb") as f:
              f.write(base64.b64decode(raw))
          PYEOF
          cp "$ORIG_KS" "$GRADLE_KS"

          if ! keytool -list \
            -alias upload \
            -keystore "$GRADLE_KS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            keytool -changealias \
              -alias "$ANDROID_KEY_ALIAS" \
              -destalias "upload" \
              -keystore "$GRADLE_KS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD"
          fi

          KEYSTORE_PATH="$GRADLE_KS" \
          STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
          ./gradlew assembleRelease --no-daemon

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found at $RELEASE_APK"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p dist
          cp "$RELEASE_APK" dist/MYATO-MUSIC-release.apk
          "$APKSIGNER" sign \
            --ks "$ORIG_KS" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            dist/MYATO-MUSIC-release.apk

          "$APKSIGNER" verify --verbose dist/MYATO-MUSIC-release.apk
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          ls -lh dist/MYATO-MUSIC-release.apk

      - name: Upload Signed Release APK Artifact
        if: steps.release_build.outputs.has_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MYATO-MUSIC-release-apk
          path: dist/MYATO-MUSIC-release.apk
          retention-days: 30

      - name: Verify Signed Release APK Before Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${{ steps.release_build.outputs.has_release }}" != "true" ] || [ ! -f dist/MYATO-MUSIC-release.apk ]; then
            echo "::error::Tag release aborted: signed MYATO-MUSIC-release.apk is required. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Secrets before pushing a version tag."
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_build.outputs.has_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: MYATO MUSIC ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MYATO-MUSIC-release.apk
            dist/MYATO-MUSIC-debug.apk
